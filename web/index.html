<!DOCTYPE html>
<html lang="es-DO">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GoTravel RD — seguimiento de tu viaje en transporte público en tiempo real.">
  <meta name="theme-color" content="#080B14">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GoTravel RD">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GoTravel RD — Viaje en vivo</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Carga la Maps JavaScript API para google_maps_flutter en web.
    La key vive en web/maps_config.js, que esta en .gitignore.
    Si el archivo no existe la app arranca igual: solo falta el mapa.
  -->
  <script src="maps_config.js" onerror="console.warn('[GoTravelRD] Falta web/maps_config.js — copia maps_config.example.js.')"></script>

  <style>
    /* Fondo del documento igual al canvas de la app: evita el flash blanco
       durante el arranque (la app es dark-first). */
    html, body { margin: 0; padding: 0; background-color: #080B14; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
